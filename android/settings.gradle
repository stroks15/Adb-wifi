pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // Kadb's ADB Wireless Debugging pairing implementation resolves SPAKE2 from JitPack.
        maven {
            url 'https://jitpack.io'
            content { includeGroup 'com.github.Flyfish233' }
        }
    }
}

rootProject.name = "LiamlizTVHack"
include(":app")
